<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Werewolf App</title>
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <div class="app">
        <div class="editions">
            <div class="Werewolves"><img src="images/edition_icons/Werewolves.png" alt="Werwölfe"></div>
            <div class="Daybreak"><img src="images/edition_icons/Daybreak.png" alt="Morgengrauen"></div>
            <div class="Vampires"><img src="images/edition_icons/Vampires.png" alt="Vampire"></div>
            <div class="Aliens"><img src="images/edition_icons/Aliens.png" alt="Aliens"></div>
            <div class="Bonus Pack"><img src="images/edition_icons/Bonus Pack.png" alt="Bonus Pack"></div>
        </div>

        <div class="roles-grid"></div>

        <button class="start-button">Start</button>
        <button class="settings-button">⚙️</button>

        <div class="night-phase">
            <div class="night-content">
                <img class="image" alt="role image" src="./images/villager.png">
                <div id="night-phase-text"></div>
            </div>
            <div class="buttons">
                <button id="pause-button">Pause</button>
                <button id="stop-button">Stop</button>
            </div>
        </div>
    </div>

    <script src="main.js" type="module" defer></script>
</body>
</html>
