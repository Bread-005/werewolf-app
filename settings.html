<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" crossorigin="anonymous" href="https://core.ontavio.de/font-awesome/6.4.0/css/all.min.css"/>
    <title>Settings</title>
</head>

<body>
    <div class="back-button">
        <a href="main.html">
            <button><i class="fa-solid fa-square-left"></i></button>
        </a>
    </div>
    <div class="settings-page">
        <div class="stepper-setting">
            <label>Sekunden pro Rolle</label>
            <div class="stepper">
                <button id="action-time-down"><i class="fa-solid fa-arrow-down"></i></button>
                <span id="action-time-display"></span>
                <button id="action-time-up"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
        <div class="stepper-setting">
            <label>Abstimmungszeit (in Sekunden)</label>
            <div class="stepper">
                <button id="voting-time-down"><i class="fa-solid fa-arrow-down"></i></button>
                <span id="voting-time-display"></span>
                <button id="voting-time-up"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
        <div class="move-card-setting">
            <label for="move-card-input">Karte bewegen am Ende</label>
            <input id="move-card-input" type="checkbox">
        </div>
        <div id="alien-settings" class="random-role-setting">Aliens...</div>
        <div id="psychic-settings" class="random-role-setting">Hellseherin...</div>
        <div id="mortician-settings" class="random-role-setting">Bestatter...</div>
        <div id="leader-settings" class="random-role-setting">Leader...</div>
        <div id="body_snatcher-settings" class="random-role-setting">Body Snatcher...</div>
        <div id="rascal-settings" class="random-role-setting">Schlingel...</div>
        <div id="oracle-settings" class="random-role-setting">Orakel...</div>
        <div id="empath-settings" class="random-role-setting">Empath...</div>
    </div>
    <script src="settings.js" type="module" defer></script>
</body>
</html>
